name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install fonttools brotli
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (save, parts x324, wind)
        run: npm test
      - name: Release build + bundle hygiene
        run: |
          npm run build
          npm run check:release
          npm run check:font
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (normal-input regressions, 12 methods, 20 gears, stress budgets)
        env:
          CI: '1'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
